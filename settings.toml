[default]
FLASK_DEBUG = false
TITLE = "Loja Architech"
# SECRET_KEY, ADMIN_USERNAME e ADMIN_PASSWORD NÃO ficam aqui: vêm de .secrets.toml
# (desenvolvimento, fora do git) ou de variáveis de ambiente FLASK_* (produção).
SESSION_COOKIE_HTTPONLY = true
SESSION_COOKIE_SAMESITE = "Lax"

[development]
FLASK_DEBUG = true
SQLALCHEMY_DATABASE_URI = "sqlite:///modelo1.db"
TEMPLATES_AUTO_RELOAD = true

[testing]
SQLALCHEMY_DATABASE_URI = "postgresql://scott:tiger@localhost/mytestingdatabase"

[production]
SQLALCHEMY_DATABASE_URI = "postgresql://scott:tiger@localhost/mydatabase"
SESSION_COOKIE_SECURE = true  # cookie de sessão só trafega por HTTPS
