{% extends 'base.html' %}

{% block title %}{{ config["TITLE"] }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <!-- Sidebar de filtros (ex: encapsulamento, tensão, protocolo) -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Filtros de Parâmetros</div>
                <div class="card-body">
                    <p class="small text-muted">Ex: DIP, SMD, ESP32, STM32...</p>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <!-- Grade de Produtos -->
            <div class="row row-cols-1 row-cols-md-3 g-3">
                <div class="col">
                    <div class="card h-100 shadow-sm">
                    {% for product in products %}
                        <div class="card-body">                             
                            <h6 class="card-title fw-bold"><a href="{{ url_for('webui.productview', product_id=product.id) }}">{{ product.id }}</a></h6>
                            <p class="card-text text-muted small">{{ product.description }}</p>
                            <span class="fw-bold text-primary">{{ "R$ {:,.2f}".format(product.price) }}</span>
                        </div>
                    {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
